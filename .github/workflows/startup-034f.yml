name: DSi 034F UI ARM7 FAT startup probes (no games)
on:
  push:
    branches: [qa/dsi-arm7-ui-fat-034f-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Safety and variant progression
        run: python3 tests/test-probe-034f.py
      - name: Build three independent probes with pinned BlocksDS toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/src" \
            -w /src skylyrac/blocksds:slim-v1.24.0 \
            bash -c 'set -euo pipefail; make -C dsi/probe-034f-f1-ui; make -C dsi/probe-034f-f2-arm7; make -C dsi/probe-034f-f3-fat'
      - name: Validate NDS headers with version-aware BlocksDS parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 tests/validate-blocks-header-034e.py dsi/probe-034f-f1-ui/DSIRB_034F_UI.nds | tee out/F1_header.json
          python3 tests/validate-blocks-header-034e.py dsi/probe-034f-f2-arm7/DSIRB_034F_ARM7.nds | tee out/F2_header.json
          python3 tests/validate-blocks-header-034e.py dsi/probe-034f-f3-fat/DSIRB_034F_FAT.nds | tee out/F3_header.json
      - name: Package removable SD-only diagnostic files and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/nds/DSiRABridge_034F
          cp dsi/probe-034f-f1-ui/DSIRB_034F_UI.nds out/nds/DSiRABridge_034F/
          cp dsi/probe-034f-f2-arm7/DSIRB_034F_ARM7.nds out/nds/DSiRABridge_034F/
          cp dsi/probe-034f-f3-fat/DSIRB_034F_FAT.nds out/nds/DSiRABridge_034F/
          cp docs/startup-034f.md out/TESTE_034F.md
          (cd out && sha256sum nds/DSiRABridge_034F/*.nds > SHA256SUMS.txt)
          (cd out && zip -qr DSi_RA_Bridge_034F_STARTUP_STAGES_SD_ONLY.zip nds TESTE_034F.md SHA256SUMS.txt)
          sha256sum out/DSi_RA_Bridge_034F_STARTUP_STAGES_SD_ONLY.zip > out/ZIP_SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DSi_RA_Bridge_034F_STARTUP_STAGES_SD_ONLY
          path: |
            out/DSi_RA_Bridge_034F_STARTUP_STAGES_SD_ONLY.zip
            out/ZIP_SHA256SUMS.txt
            out/F1_header.json
            out/F2_header.json
            out/F3_header.json
          if-no-files-found: error
          retention-days: 14
